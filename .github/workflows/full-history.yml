name: StockStory V2.2 Full Historical
on:
  workflow_dispatch:
  schedule:
    - cron: '0 12 * * 1-5'
    - cron: '32 12 * * 1-5'
permissions:
  contents: write
jobs:
  historical:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Detect phase
        id: phase
        shell: bash
        run: |
          HOUR=$(date -u +%H)
          MIN=$(date -u +%M)
          if [ "$HOUR" = "12" ] && [ "$MIN" -lt "20" ]; then
            echo "phase=1" >> "$GITHUB_OUTPUT"
          else
            echo "phase=2" >> "$GITHUB_OUTPUT"
          fi
      - name: Update historical metrics
        env:
          UPSTOX_TOKEN: ${{ secrets.UPSTOX_TOKEN }}
          HISTORY_PHASE: ${{ steps.phase.outputs.phase }}
        run: python scripts/full_history.py
      - name: Commit historical data
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "📚 Update NSE historical metrics"
          file_pattern: "data/market.json"
